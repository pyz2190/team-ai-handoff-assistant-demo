<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-label="主要交接业务活动图"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#1a1a1f} .muted{fill:#55545d} .white{fill:white}</style><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#636363"/></marker></defs><text x="35" y="40" font-size="26" class="">主要交接业务活动</text><rect x="240" y="80" width="700" height="62" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="260" y="118" font-size="17" class="">A</text><text x="400" y="118" font-size="17" class="">创建任务、导入材料</text><path d="M590 142 L590 180" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="180" width="700" height="62" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="260" y="218" font-size="17" class="">A</text><text x="400" y="218" font-size="17" class="">选择人工填写，或确认模型输入范围</text><path d="M590 242 L590 280" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="280" width="700" height="62" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="260" y="318" font-size="17" class="">模型／系统</text><text x="400" y="318" font-size="17" class="">AI 返回五项草稿；失败转人工路径</text><path d="M590 342 L590 380" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="380" width="700" height="62" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="260" y="418" font-size="17" class="">A</text><text x="400" y="418" font-size="17" class="">人工编辑与来源核对 → 主动确认版本</text><path d="M590 442 L590 480" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="480" width="700" height="62" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="260" y="518" font-size="17" class="">A／系统</text><text x="400" y="518" font-size="17" class="">指定 B 并发起；绑定版本，负责人仍 A</text><path d="M590 542 L590 580" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="580" width="700" height="62" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="260" y="618" font-size="17" class="">B</text><text x="400" y="618" font-size="17" class="">阅读确认版本与来源，选择处理方式</text><path d="M590 642 L590 685" fill="none" stroke="#636363" stroke-width="1.5"/><path d="M155 685 L1020 685" fill="none" stroke="#636363" stroke-width="1.5"/><path d="M190 685 L190 725" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="35" y="725" width="310" height="160" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="53" y="760" font-size="21" class="">请求补充</text><text x="53" y="804" font-size="16" class="">暂停接收，负责人仍 A</text><text x="53" y="844" font-size="16" class="">A 补充、重审、另发请求</text><path d="M550 685 L550 725" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="395" y="725" width="310" height="160" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="413" y="760" font-size="21" class="">拒绝</text><text x="413" y="804" font-size="16" class="">终结请求，负责人仍 A</text><text x="413" y="844" font-size="16" class="">A 再协调并新发请求</text><path d="M910 685 L910 725" fill="none" stroke="#636363" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="755" y="725" width="310" height="160" rx="5" fill="#f5f5f5" stroke="#cacaca"/><text x="773" y="760" font-size="21" class="">主动接收</text><text x="773" y="804" font-size="16" class="">复核权限、指定人、请求和版本</text><text x="773" y="844" font-size="16" class="">有效才记录接收并转为 B</text><text x="35" y="940" font-size="18" class="">接收校验失败：拒绝操作，责任不变。重要变更使旧请求失效。</text><text x="35" y="980" font-size="17" class="">模型输入：目标、验收标准、获准正文；无代码执行、外部读取或业务写入工具。</text><text x="35" y="1020" font-size="16" class="muted">补充路径按 D-03 处理；继续工作不改变既有接收历史，接收不自动完成任务。</text><path d="M940 211 L1010 211 L1010 411 L940 411" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1020" y="310" font-size="16">人工</text><text x="1020" y="336" font-size="16">路径</text><text x="610" y="268" font-size="16">使用 AI</text></svg>
