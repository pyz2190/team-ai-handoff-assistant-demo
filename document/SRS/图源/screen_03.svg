<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-label="草稿与人工审核"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#1a1a1f} .muted{fill:#55545d} .white{fill:white}</style><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1100" height="66" rx="0" fill="#f2f2f2" stroke="#cacaca"/><text x="30" y="42" font-size="23" class="">团队交接助手</text><text x="815" y="40" font-size="16" class="muted">第 16 组  /  演示数据</text><text x="40" y="118" font-size="28" class="">交接草稿与人工审核</text><text x="40" y="153" font-size="16" class="muted">UI-03  /  T-014 · 草稿 v1 · 人工确认后才可发起交接</text><path d="M680 185 L680 650" fill="none" stroke="#636363" stroke-width="1.5"/><text x="40" y="210" font-size="18" class="">已完成事项</text><text x="40" y="242" font-size="17" class="">已加入空文件判断。 [S-01 v1 第 3 行]</text><text x="40" y="290" font-size="18" class="">关键决策及理由</text><text x="40" y="322" font-size="17" class="">先拒绝空输入，避免产生无意义材料。 [S-01]</text><text x="40" y="370" font-size="18" class="">验证情况</text><text x="40" y="402" font-size="17" class="">空文件样例通过；超限分支未验证。 [S-02]</text><text x="40" y="450" font-size="18" class="">遗留问题</text><text x="40" y="482" font-size="17" class="">补充超限和编码异常的检查输出。 [S-01]</text><text x="40" y="530" font-size="18" class="">下一步建议</text><text x="40" y="562" font-size="17" class="">建议 B 补齐边界样例并导入结果。</text><text x="710" y="215" font-size="20" class="">来源回看 · S-02 v1</text><text x="710" y="258" font-size="16" class="muted">合成示例，第 1–3 行</text><text x="710" y="302" font-size="18" class="">空文件检查：通过</text><text x="710" y="340" font-size="18" class="">有效文本检查：通过</text><text x="710" y="378" font-size="18" class="">大小限制检查：未执行</text><text x="710" y="449" font-size="18" class="">引用存在 ≠ 结论已证实</text><text x="710" y="486" font-size="17" class="muted">确认前请逐项核对语义。</text><rect x="40" y="635" width="145" height="40" rx="5" fill="white" stroke="#cacaca"/><text x="54" y="661" font-size="16" class="">保存草稿</text><rect x="205" y="635" width="170" height="40" rx="5" fill="#513f91" stroke="#cacaca"/><text x="219" y="661" font-size="16" class="white">确认此版本</text><text x="710" y="605" font-size="16" class="muted">模型失败时可继续人工填写。</text></svg>
