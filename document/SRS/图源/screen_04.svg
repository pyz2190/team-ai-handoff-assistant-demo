<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-label="交接请求与接收"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#1a1a1f} .muted{fill:#55545d} .white{fill:white}</style><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1100" height="66" rx="0" fill="#f2f2f2" stroke="#cacaca"/><text x="30" y="42" font-size="23" class="">团队交接助手</text><text x="815" y="40" font-size="16" class="muted">第 16 组  /  演示数据</text><text x="40" y="118" font-size="28" class="">交接请求 R-008</text><text x="40" y="153" font-size="16" class="muted">UI-04  /  当前负责人 A · 指定接手人 B · 待接收 · 任务进行中</text><text x="40" y="215" font-size="23" class="">确认版本 v1</text><text x="40" y="253" font-size="18" class="">由 A 人工确认 · 固定任务目标、验收标准与来源 S-01 / S-02</text><path d="M40 283 L1060 283" fill="none" stroke="#636363" stroke-width="1.5"/><text x="40" y="330" font-size="21" class="">接收前需要了解</text><text x="40" y="374" font-size="18" class="">已完成：空文件判断。验证：空文件与有效文本样例通过。</text><text x="40" y="414" font-size="18" class="">未验证：大小限制、编码异常。下一步：补齐边界样例。</text><rect x="40" y="450" width="155" height="40" rx="5" fill="white" stroke="#cacaca"/><text x="54" y="476" font-size="16" class="">查看完整版本</text><rect x="215" y="450" width="155" height="40" rx="5" fill="white" stroke="#cacaca"/><text x="229" y="476" font-size="16" class="">回看来源</text><text x="40" y="543" font-size="19" class="">我已阅读此版本及未知事项，愿意承担后续工作。</text><rect x="40" y="582" width="155" height="40" rx="5" fill="white" stroke="#cacaca"/><text x="54" y="608" font-size="16" class="">请求补充</text><rect x="215" y="582" width="155" height="40" rx="5" fill="white" stroke="#cacaca"/><text x="229" y="608" font-size="16" class="">拒绝接收</text><rect x="810" y="582" width="245" height="40" rx="5" fill="#513f91" stroke="#cacaca"/><text x="824" y="608" font-size="16" class="white">确认接收并承担任务</text><text x="40" y="666" font-size="16" class="muted">若版本失效，接收将被阻止；成功后负责人变 B，工作进度保持原值。</text></svg>
