<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><style>text{font-family:Microsoft YaHei,Arial,sans-serif}</style><rect width="1100" height="740" fill="white"/><rect x="0" y="0" width="1100" height="66" rx="5" fill="#f3f3f3" stroke="#d5d5d5"/><text x="30" y="43" font-size="24" fill="#24232a">团队交接助手</text><text x="845" y="42" font-size="16" fill="#24232a">第 16 组 · 演示数据</text><text x="40" y="120" font-size="28" fill="#24232a">模型输入预览与发送确认</text><text x="40" y="157" font-size="16" fill="#61616b">UI-05  / 当前操作人 A · 仅整理材料 · 五项交接草稿</text><text x="40" y="215" font-size="22" fill="#24232a">将发送至外部模型的内容</text><text x="40" y="256" font-size="18" fill="#24232a">目标：让空文件和不支持的输入获得明确提示。</text><text x="40" y="294" font-size="18" fill="#24232a">验收标准：空文件被拒绝；有效文本可回看；错误不显示成功。</text><rect x="40" y="325" width="1020" height="148" rx="5" fill="#f7f7f8" stroke="#d5d5d5"/><text x="60" y="361" font-size="19" fill="#24232a">已选择的正文材料</text><text x="60" y="404" font-size="18" fill="#24232a">S-01 v1 工作笔记　已加入空输入判断，大小限制分支待补充。</text><text x="60" y="445" font-size="18" fill="#24232a">S-02 v1 检查输出　空文件通过；有效文本通过；大小限制未执行。</text><text x="40" y="523" font-size="17" fill="#24232a">不包含：未选材料、其他项目、应用密钥，以及外部链接的未读取正文。</text><text x="40" y="563" font-size="17" fill="#24232a">请检查敏感信息；确认后才会向已配置的模型服务发送上述内容。</text><rect x="40" y="620" width="170" height="44" rx="5" fill="white" stroke="#d5d5d5"/><text x="58" y="649" font-size="17" fill="#24232a">返回修改选择</text><rect x="230" y="620" width="170" height="44" rx="5" fill="white" stroke="#d5d5d5"/><text x="248" y="649" font-size="17" fill="#24232a">改为人工填写</text><rect x="785" y="620" width="275" height="44" rx="5" fill="#55418b" stroke="#d5d5d5"/><text x="803" y="649" font-size="17" fill="white">确认发送并生成草稿</text><text x="40" y="706" font-size="16" fill="#61616b">生成失败时保留材料与人工内容；生成结果仍需审核，不自动发起交接。</text></svg>