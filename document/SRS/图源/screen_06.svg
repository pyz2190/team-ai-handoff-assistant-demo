<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><style>text{font-family:Microsoft YaHei,Arial,sans-serif}</style><rect width="1100" height="740" fill="white"/><rect x="0" y="0" width="1100" height="66" rx="5" fill="#f3f3f3" stroke="#d5d5d5"/><text x="30" y="43" font-size="24" fill="#24232a">团队交接助手</text><text x="845" y="42" font-size="16" fill="#24232a">第 16 组 · 演示数据</text><text x="40" y="120" font-size="28" fill="#24232a">指定接手人与发起交接</text><text x="40" y="157" font-size="16" fill="#61616b">UI-06  / 当前负责人 A · 内容已确认 v1 · 尚未发起</text><text x="40" y="215" font-size="22" fill="#24232a">已确认内容</text><text x="40" y="255" font-size="18" fill="#24232a">任务 T-014 · 确认版本 v1 · 确认者 A · 来源 S-01 v1 与 S-02 v1</text><text x="40" y="298" font-size="18" fill="#24232a">未知事项：大小限制与编码异常尚未验证，接手者会看到此说明。</text><text x="40" y="361" font-size="20" fill="#24232a">选择接手人</text><rect x="40" y="384" width="590" height="58" rx="5" fill="white" stroke="#d5d5d5"/><text x="60" y="422" font-size="18" fill="#24232a">成员 B　项目成员，可接收此任务</text><text x="590" y="422" font-size="22" fill="#24232a">⌄</text><text x="40" y="489" font-size="19" fill="#24232a">本次将创建绑定 v1 的交接请求，当前负责人仍为 A。</text><text x="40" y="531" font-size="17" fill="#24232a">B 主动接收后才转移责任；若有旧有效请求，换人后旧请求失效。</text><rect x="40" y="612" width="170" height="44" rx="5" fill="white" stroke="#d5d5d5"/><text x="58" y="641" font-size="17" fill="#24232a">查看确认内容</text><rect x="810" y="612" width="250" height="44" rx="5" fill="#55418b" stroke="#d5d5d5"/><text x="828" y="641" font-size="17" fill="white">发起交接给成员 B</text><text x="40" y="702" font-size="16" fill="#61616b">版本过期或成员资格无效时阻止发起，并提示重新审核或重新选择。</text></svg>