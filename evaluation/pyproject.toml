[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-eval"
version = "0.1.0"
description = "Offline C0/C1/C2 evaluation harness for handoff artifacts"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
handoff-eval = "handoff_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
